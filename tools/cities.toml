# The City & dungeon map's places (docs/addons/map.md "City plans", ADR 0065): one [[place]] per
# sheet. tools/city_sheet.py builds every place from this list, so the manifest never loses one.
#
# ui         the place's UiMap
# name       the client's name of that UiMap (the window shows the zone's own, in the player's language)
# continent  the Map.db2 id the place lies on
# wx, wy     UiMapAssignment's Region of the place, world yards (wx south to north, wy east to west);
#            the tool holds them against the newest dump in .local/out and refuses another Region
# look       "painted": a finished sheet <sheets>/<ui>.png (the painting with the real ways, roofs,
#            walls, water and trees; map.md "The look on the sheet")
#            "painting": the game's own painting, cleaned and enlarged, <paintings>/<ui>_x4.png
#            (tools/map_blizzard.py, ADR 0036); the first step for a place whose look is not built
# seed       optional: a walked point of the place, world wx, wy, wz (its flight master in
#            TaxiNodes). tools/city_fit.py keeps only the ground one reaches from there
# [place.painted]  what tools/city_look.py needs to build the painted sheet; its keys are listed in
#            map.md "The `[place.painted]` table". A place may have the table while its look is
#            still "painting": then a candidate can be built, and nothing ships
# ground     true: the world map draws the sheet as the ground, cut out to the city's plan (a city
#            inside the ground, whose terrain is what lies over it; map.md "Cities inside the
#            ground"). tools/city_ground.py writes the masks from the walk mesh
#
# Regions measured 17.11.2026, Forever 1.60.1.70938 (f70938_UiMapAssignment.json, one assignment
# per place, UiMin 0,0 and UiMax 1,1); Stormwind's as measured 08.11.2026 on 70862.

