# Attunements for WoW Forever (quests.md "Attunements"): the Classic lists, quest IDs from memory of
# the 1.12 data; `verified = false` until the chain was checked on the Forever client. The build
# compares every quest step's label with the quest name in the data and notes mismatches in the
# report (pipeline/bastians_build/attunements.py), so a wrong ID shows up at build time.
# Step shapes: ["quest", id, label] ; ["rep", factionID, name, standing 1..8] ; ["item", id, name].
# Forever-specific attunements: none known yet (add them here when the beta or launch shows one).

