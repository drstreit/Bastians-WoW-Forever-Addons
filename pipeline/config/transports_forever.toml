[[transport]]
id = "tram-stormwind-ironforge"
kind = "tram"
name = "Deeprun Tram"
faction = "Alliance"
# The entrances where the tram's exit triggers put a player (CMaNGOS areatrigger_teleport 2171
# Stormwind (-8354.23, 524.07) and 2166 Ironforge (-4839.51, -1317.74), world yards) through the
# Forever transforms of probe 70532 (23.10.2026). Forever keeps Classic's world positions (four
# Stormwind NPCs measured on Forever lie within 3 yards of their CMaNGOS spawns), but Stormwind's
# map is redrawn: the Classic fraction (0.637, 0.235) put the entrance 125 yards north, outside
# the city wall.
stops = [[1453, 0.690, 0.309, "Stormwind, Deeprun Tram"], [1455, 0.764, 0.512, "Ironforge, Deeprun Tram"]]
ride = 59
cycle = 120
verified = false
note = "Ride measured on Forever 21.10.2026: 59 s boarding to arrival. Entrances from the exit triggers (23.10.2026); the loop time is still the Classic estimate."

