# Build configuration: packs, their schemas (field order per type), indexes and size budgets (data.md).
# A type belongs to exactly one pack. The loader never hard-codes positions: it reads the schema.
# Field meanings: data.md "Canonical model". Coordinates: spawns = { {uiMapID, x, y, src}, ... } as
# map fractions; spots = { [uiMapID] = { {x, y, kind, objectiveMask}, ... } }. Money is integer copper.

[packs.world]
addon = "Bastians_Data_World"
file = "World.lua"
# 12 MB since 20.10.2026 (was 10): Classic mob places, up to 12 per map, made the Forever pack 10.9 MB
budget_kb = 12288
indexes = ["npc.byZone", "object.byZone", "node.byZone", "entrance.byZone", "entrance.byInstance", "area.byZone", "area.toMap"]

[packs.world.schema]
# loot = { {itemID, chance percent}, ... } with lootSrc "classic" (CMaNGOS) or "tdb" (retail, ItemDB)
# dungeon: the instance a boss belongs to (data.md "Dungeons"); a loot row without a chance is
# an item ForeverDB players saw drop in Forever, its chance unknown
npc = ["name", "subname", "level", "levelMax", "zone", "flags", "faction", "spawns", "vendor", "trainer", "loot", "lootSrc", "src", "dungeon"]
object = ["name", "kind", "zone", "spawns", "loot", "lootSrc", "src"]
zone = ["name", "parent", "continent", "levelLo", "levelHi", "levelMed", "questsA", "questsH", "mapType"]
# the subzones (data.md "Areas"), id = AreaTable id: zone the uiMapID it lies in; continent, wx, wy
# the world place (the chunk nearest the mean of its terrain chunks), r its radius in yards; spawns
# the map place for drawing when the build had transforms; chunks how many terrain chunks carry it
area = ["name", "zone", "continent", "wx", "wy", "r", "chunks", "spawns", "src"]
node = ["name", "kind", "profession", "skill", "item", "icon", "spawns", "src"]
# flight masters from the client's TaxiNodes table (route.md): world yards are the planner's frame,
# spawns (map fractions) exist when the build had a transform table; faction is A | H | both
flightpath = ["name", "faction", "continent", "wx", "wy", "spawns", "src"]
# boats, zeppelins, trams, portals from pipeline/config/places_<client>.toml (route.md): stops are
# [uiMapID, x, y, label], world is [continent, wx, wy] per stop when the build had transforms, ride and
# cycle are seconds (nil = unknown), verified = measured in game
# departs: seconds into the cycle the vessel leaves each stop; dock: seconds it lies at a stop (R26.6)
transport = ["name", "kind", "faction", "stops", "world", "ride", "cycle", "verified", "note", "spawns", "src", "departs", "dock"]
# instance entrances from pipeline/config/places_<client>.toml (ADR 0026, data.md "Our authored
# tables"): id <instance>-<n>; continent, wx, wy, wz the world place; spawns the map place for
# drawing when the build had transforms; level the required level; verified = checked in game
entrance = ["name", "label", "instance", "level", "zone", "continent", "wx", "wy", "wz", "spawns", "verified", "note", "src"]
# the teleports a character may have (places_<client>.toml [[teleport]], route.md "Home and every way back")
teleport = ["name", "kind", "spell", "item", "faction", "class", "reagent", "hearth", "continent", "wx", "wy", "wz", "cast", "verified", "note", "src"]
# dungeons and raids from ForeverDB's Dungeons.lua (data.md "Dungeons", 30.10.2026): id = the
# instance's Map.db2 id (our entrance rows' `instance`); kind dungeon | raid; size the group;
# bosses = { {order, npcID, name} }; loot = { {itemID, bossOrder, label} } with order 0 for the
# instance's unassigned loot and label s (seen in Forever) | c (the client ties it to the instance);
# quests = the dungeon quests ForeverDB confirmed in Forever
dungeon = ["name", "kind", "size", "levelLo", "levelHi", "levelReq", "zone", "bosses", "loot", "quests", "src"]

[packs.quests]
addon = "Bastians_Data_Quests"
file = "Quests.lua"
budget_kb = 6144
# retail (20.10.2026): 32,409 obtainable quests with a giver, place or zone make 9.0 MB; budget per
# client, the in-game cost is measured in B11.1 (data.md "Retail data")
# 11 MB since 29.10.2026: the client's quest lines and objective areas (ADR 0035) took it to 10.9 MB
budget_kb_retail = 11264
# byStart, byTurnIn, followers, chainMembers and chainFrom are the quest graph Quests' Logic reads
# (B11.1, 21.10.2026): shipped, so no zone page decodes every quest to build them
indexes = [
  "quest.byZone", "quest.byGiver", "quest.byEnder", "quest.byItem", "attunement.byFaction",
  "quest.byStart", "quest.byTurnIn", "quest.followers", "quest.chainMembers", "quest.chainFrom",
  "quest.byDungeon",
]

[packs.quests.schema]
quest = ["name", "level", "minLevel", "qtype", "races", "classes", "starts", "startPlaces", "ends", "endPlaces", "pre", "preAny", "excl", "chain", "parent", "skill", "minRep", "flags", "holiday", "foreverOnly", "zone", "objectives", "spots", "rewards", "requiredItems", "seenBy", "src", "dungeon"]
# attunements (quests.md): hand-written lists from pipeline/config/attunements_<client>.toml; steps are
# [kind, id, label(, standing)] with kind "quest" | "rep" | "item"
attunement = ["name", "faction", "verified", "note", "steps", "src"]

[packs.items]
addon = "Bastians_Data_Items"
file = "Items.lua"
budget_kb = 8192
# retail (20.10.2026): 57,726 referenced items make 10.2 MB in format A (the plain name table for
# search adds 1.7 MB); headroom for the next AllTheThings release
budget_kb_retail = 14336  # 13 MB since 28.10.2026: TrinityCore's loot (11.0 MB) and 12,208 recipes from
# AllTheThings (+1.1 MB) took it to 12.1 MB; 14 MB since 29.10.2026: the client's item facts and the
# recipes' names, products and reagents (ADR 0035) took it to 13.5 MB
indexes = []

[packs.items.schema]
item = ["name", "quality", "level", "reqLevel", "class", "subclass", "sell", "buy", "stack", "foreverNew", "foreverChanged", "madeBy", "questItem", "drops", "dropsSrc", "worldDrop", "src"]
recipe = ["name", "profession", "skill", "item", "count", "reagents", "source", "sourceItem", "foreverNew", "src"]

# the AHSync market export (ahsync-export.md), read with --export; optional: no export, no pack
[packs.market]
addon = "Bastians_Data_Market"
file = "Market.lua"
# 23.10.2026, the first real export shipped for EU RP (8,281 US beta prices, 1,008 claims):
# 1,149 KB on disk, 2.3 MB of Lua memory after loading (measured on Lua 5.1)
budget_kb = 1536
optional = true
indexes = ["market.list", "signal.byMarket", "spot.all", "spot.byItem", "strategy.all"]

[packs.market.schema]
# price keyed "<market>:<itemID>": copper unit prices, nil = unknown, src = the label shown to the player
price = ["median", "minBuyout", "quantity", "median7d", "median30d", "low30d", "high30d", "salesPerDay", "scanTs", "src"]
# signal keyed "<market>:<signalID>" (the Today lines); flags such as "needs:<profession>" or "spot:<id>"
signal = ["module", "action", "item", "horizon", "confidence", "rationale", "capital", "profit", "minutes", "flags", "validUntil", "src"]
# farm spots by id: items = { {itemID, perHour}, ... }, strategy = the claim behind it
spot = ["name", "map", "x", "y", "radius", "levelMin", "levelMax", "items", "status", "strategy", "src"]
# strategies (claims) by id
strategy = ["kind", "subject", "item", "map", "x", "y", "weight", "reach", "status", "build", "firstSeen", "lastSeen", "src"]

# the Strategies book (strategies-design.md section 6): content/strategies with the export's claims;
# optional, built with --export when the content folder exists (fixture builds name it with --book)
[packs.book]
addon = "Bastians_Data_Strategies"
file = "Book.lua"
budget_kb = 1024
optional = true
indexes = ["book.toc", "book.mill"]

[packs.book.schema]
chapter = ["name", "order", "opening", "active"]
# pages keyed by their permanent id (the file name); shelf = active | back | retired (a tombstone:
# no text, the date, the reason, the successor); blocks = the text, plate and live precomputed;
# art = true when the page's picture ships (Generated/Art/<id>.blp, tools/book_art.py)
page = ["name", "chapter", "order", "levelMin", "levelMax", "zones", "meta", "blocks", "rumours", "plate", "live", "table", "refs", "shelf", "pinned", "added", "updated", "retired", "reason", "successor", "art"]
# the claims the pages rest on, by claim id: AHSync's own sentence and the sources (channel, date, link)
rumour = ["claim", "kind", "status", "subject", "sources"]
# What's new, newest first: book.toml's entries and the ones the build writes (book_news.py);
# an entry links its page or its chapter's Rumour mill (`mill` = the chapter id); the build's own
# carry `kind` (travellers, stamp, mill, more) and `n` (how many), so the suite's What's new can
# fold a day into one line (ADR 0021); book.toml's have neither
news = ["date", "text", "page", "mill", "kind", "n"]
# the Rumour mill (design section 7), by claim id: per chapter the strongest strategies no page
# tells yet, by rank; the zone, or the claim's own place without one; how many channels and claims
mill = ["chapter", "rank", "zone", "where", "channels", "claims"]

[packs.text]
addon = "Bastians_Data_Text_enUS"
file = "Text_enUS.lua"
budget_kb = 4096
indexes = []

[packs.text.schema]
# quest texts live on the quest record as `text`; the text pack carries them separately (B3.5)
questText = ["details", "objectives", "offer", "progress", "src"]

# The game data in German, French and Spanish (data.md "Game data in other languages", ADR 0033):
# the local names and texts of the records our packs carry, from QuestieDB's l10n lookups and
# CMaNGOS' quest locales (bastians_build data --l10n, --cmangos); stubs without them. esES serves
# the Mexican client too; Korean and Chinese since 29.10.2026 (owner).
# Measured 29.10.2026 (Forever, QuestieDB 7901fee): frFR 3.4 MB, esES 3.6 MB, koKR 3.6 MB, zhTW 3.8 MB;
# deDE and zhCN carry CMaNGOS' long quest texts as well (6.5 and 5.2 MB). Only the
# client's own language builds its tables (the guard), so one pack costs memory, like Text_enUS.
[packs.text_deDE]
addon = "Bastians_Data_Text_deDE"
file = "Text_deDE.lua"
# with CMaNGOS' long quest texts: measured 29.10.2026 deDE 6.5 MB, zhCN 5.2 MB
# 29.10.2026 with the client's own item, spell and profession names in every language (ADR 0035): measured deDE 7.2 MB, zhCN 5.8 MB, frFR 4.2, esES 4.3, koKR 4.4, zhTW 4.4 MB
budget_kb = 8192  # was 7168
indexes = []
# retail: names only (TDB), measured 29.10.2026 5.0 to 5.6 MB
budget_kb_retail = 6144
optional = true
locales = ["deDE"]

[packs.text_deDE.schema]
quest_deDE = ["name", "objectives", "details", "offer", "progress"]
npc_deDE = ["name", "subname"]
item_deDE = ["name"]
object_deDE = ["name"]

[packs.text_frFR]
addon = "Bastians_Data_Text_frFR"
file = "Text_frFR.lua"
# 29.10.2026 with the client's own item, spell and profession names in every language (ADR 0035): measured deDE 7.2 MB, zhCN 5.8 MB, frFR 4.2, esES 4.3, koKR 4.4, zhTW 4.4 MB
budget_kb = 5120  # was 4096
indexes = []
# retail: names only (TDB), measured 29.10.2026 5.0 to 5.6 MB
budget_kb_retail = 6144
optional = true
locales = ["frFR"]

[packs.text_frFR.schema]
