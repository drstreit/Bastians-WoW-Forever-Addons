# High contrast: black ground, white text, yellow accent, stronger edges (ST3, ADR 0017).
id = "contrast"
name = "High contrast"
order = 4

[colors]
bg = "#000000"
panel = "#000000"
header = "#1a1a1a"
line = "#ffffff99"
hover = "#ffffff40"
hoverBlock = "#ffff0026"
# the quest sheet (ADR 0053): parchment in every theme, a page of its own
sheetInk = "#2e2014"
sheetDim = "#57442f"
sheetTitle = "#802b18"
sheetGood = "#1d5220"
sheetLine = "#3b2a1747"
sheetTile = "#241b10"
sheetTileText = "#f3e6c8"
badgeInk = "#050505"       # the words on a light badge (a tile's level, ADR 0056)
badgeInkLight = "#ffffff"  # the words on a dark badge
sheetXp = "#9a35c8"
press = "#ffffff33"
faceHover = "#333333"
track = "#ffffff26"
rule = "#ffffff99"
divider = "#ffffff4d"
text = "#ffffff"
dim = "#e0e0e0"
muted = "#c8c8c8"
bright = "#ffffff"
mapText = "#1a1a1a"     # words on the map, every style: place and zone names, pin names
mapTextDim = "#404040"  # the map's second words: a zone's level band, small places
mapTextRim = "#f5f1e6d9"  # the light rim around the map's words (dark ground)
# a zone's level band on the map (A3.4): the difficulty colours' dark twins, readable on
# the light rim
mapDiffRed = "#a01c1c"
mapDiffOrange = "#9a4a0a"
mapDiffYellow = "#6e5a00"
mapDiffGreen = "#2a6a22"
mapDiffGrey = "#5c5c5c"
accent = "#ffff00"
wayWanderer = "#ffaa00"    # the welcome: the Wanderer's picture frame (warm; plan-launch-version 2.4)
wayScholar = "#00c8ff"     # the welcome: the Scholar's picture frame (cool)
gold = "#ffe600"
on = "#00ff66"
good = "#00ff66"
bad = "#ff4d4d"
warn = "#ffaa00"
neutral = "#e0e0e0"
rare = "#d38cff"
water = "#33ccff"
# the six note colours of Bastian's Notes (notes.md, J)
note1 = "#f2c94c"
note2 = "#6fcf97"
note3 = "#56ccf2"
note4 = "#bb6bd9"
note5 = "#f2994a"
note6 = "#eb5757"
chat = "#ffff00"
chatEmote = "#ffb366"   # emote lines in the chat, bright (L5)
tipText = "#ffffff"
tipDim = "#e6e6e6"
tipGold = "#ffd100"
diffRed = "#ff4d4d"
diffOrange = "#ffaa00"
diffYellow = "#ffff00"
diffGreen = "#00ff66"
diffGrey = "#c8c8c8"
coinGold = "#ffe600"
coinSilver = "#e6e6f0"
coinCopper = "#ffb366"
sea = "#b8a380"
path = "#00ffffe6"
waypoint = "#ffffffcc"
waypointLoud = "#ffff00"
grid = "#ffffff66"
# the Library's book (library.md 10.1): the same paper and ink in every theme, a book keeps its
# paper. The paper colours multiply the drawn paper (white: as drawn); night darkens it.
bookPaper = "#ffffff"
bookInk = "#2a1c10"
bookInkSoft = "#6b5538"
bookRubric = "#8f2716"
bookGold = "#e0bd72"
bookSepia = "#d8b98a"
bookCover = "#ffffff"
bookPaperNight = "#4a4d5a"
bookInkNight = "#efe3c8"
bookInkSoftNight = "#b7a98d"
bookRubricNight = "#f08f74"
# the reading settings (library.md 10.2): the backgrounds, inks and highlights a reader picks, the
# same in every theme; a test measures the contrast of every pair
# the drawn paper's mean colour (Media/Paper.tga, a test keeps it true): the contrast is
# measured against it
bookPaperTone = "#e3d3b0"
bookBgWhite = "#fbfaf6"
bookBgCream = "#f3e9d2"
bookBgGrey = "#d4d4d0"
bookBgGreen = "#cde6cf"
bookBgBlack = "#121212"
bookInkBlack = "#141414"
bookInkBlue = "#16306a"
bookInkWhite = "#f2efe8"
bookInkAmber = "#ffc871"
bookBlue = "#1f4fa3"
bookBlueNight = "#9cc2ff"

# round 4 (ADR 0038): colour by meaning. Services (on tiles, chips, badges and counts, never on names),
# the entity types, depth (the void behind the panes, a raised card, its light edge, the inner
# highlight), and the title bar's words.
svcVendor = "#ffe066"
svcQuest = "#ffff00"
svcTrainer = "#66b3ff"
svcInn = "#d9a6ff"
svcFlight = "#66e6f2"
svcRepair = "#d9cbb3"
svcFriendly = "#00ff66"
svcHostile = "#ff4d4d"
typeNpc = "#00ff66"
typeItem = "#66b3ff"
typeQuest = "#ffff00"
typeObject = "#ffb380"
typeNode = "#66e6f2"
typeZone = "#99ff99"
typeRecipe = "#ffaa00"
typeSpot = "#ffe066"
typeChain = "#d9a6ff"
typeHere = "#00ffff"
void = "#000000a6"
card = "#ffffff14"
cardEdge = "#ffffff4d"
inset = "#ffffff1f"
headerText = "#ffffff"

# the kind tiles' eight groups (ADR 0046): value, hostile, place, nature, people, special, goods, other
tileGold = "#b98a1c"
tileRed = "#c84f46"
tileTeal = "#1fa39a"
tileGreen = "#45a04f"
tileBlue = "#4a82d1"
tilePurple = "#7f5bc4"
tileBrown = "#92703d"
tileGrey = "#767f88"

[shape]
radius = 3
radiusSmall = 2

# the widget set's sizes in px, the ground's alpha in % (ADR 0046, one look per theme)
[geometry]
action = 26
actionRow = 22
pill = 26
tab = 26
row = 28
tile = 18
tileBig = 26
gap = 6
groundAlpha = 100
