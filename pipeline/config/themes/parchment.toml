# Parchment: a light theme to match the map art, ink on paper (ST3, ADR 0017).
id = "parchment"
name = "Parchment"
order = 2

[colors]
bg = "#e8d9b5f5"
panel = "#e0cfa6fa"
header = "#d2bd8f"
line = "#3b2a1740"
hover = "#3b2a171a"
hoverBlock = "#2f7f7a30"
# the quest sheet (ADR 0053): parchment in every theme, a page of its own
sheetInk = "#2e2014"
sheetDim = "#57442f"
sheetTitle = "#802b18"
sheetGood = "#1d5220"
sheetLine = "#3b2a1747"
sheetTile = "#241b10"
sheetTileText = "#f3e6c8"
badgeInk = "#050505"       # the words on a light badge (a tile's level, ADR 0056)
badgeInkLight = "#ffffff"  # the words on a dark badge
sheetXp = "#9a35c8"
press = "#3b2a1726"
faceHover = "#d8c497"
track = "#3b2a1714"
rule = "#3b2a1747"
divider = "#3b2a1726"
text = "#2e2014"
dim = "#57442f"
muted = "#524636"
bright = "#1a1008"
mapText = "#1a1a1a"     # words on the map, every style: place and zone names, pin names
mapTextDim = "#404040"  # the map's second words: a zone's level band, small places
mapTextRim = "#f5f1e6d9"  # the light rim around the map's words (dark ground)
# a zone's level band on the map (A3.4): the difficulty colours' dark twins, readable on
# the light rim
mapDiffRed = "#a01c1c"
mapDiffOrange = "#9a4a0a"
mapDiffYellow = "#6e5a00"
mapDiffGreen = "#2a6a22"
mapDiffGrey = "#5c5c5c"
accent = "#802b18"
wayWanderer = "#a8551c"    # the welcome: the Wanderer's picture frame (warm; plan-launch-version 2.4)
wayScholar = "#1f5a96"     # the welcome: the Scholar's picture frame (cool)
gold = "#5e4200"
on = "#1e521b"
good = "#1d5220"
bad = "#882018"
warn = "#713900"
neutral = "#504638"
rare = "#6a1ba0"
water = "#144b73"
# the six note colours of Bastian's Notes (notes.md, J), dark enough for the paper
note1 = "#5d4300"
note2 = "#19521f"
note3 = "#144b73"
note4 = "#62327f"
note5 = "#723800"
note6 = "#802a2a"
chat = "#66ccff"
chatEmote = "#e8b47a"   # emote lines in the chat: sepia, the parchment of the scheme (L5)
tipText = "#ffffff"
tipDim = "#cccccc"
tipGold = "#ffd100"
diffRed = "#8e1717"
diffOrange = "#73370b"
diffYellow = "#554600"
diffGreen = "#1e521b"
diffGrey = "#4e463d"
coinGold = "#5c4400"
coinSilver = "#46474c"
coinCopper = "#6e3a19"
sea = "#b8a380"
path = "#1f6fa8e6"
waypoint = "#3b2a1799"
waypointLoud = "#b36b00"
grid = "#3b2a1740"
# the Library's book (library.md 10.1): the same paper and ink in every theme, a book keeps its
# paper. The paper colours multiply the drawn paper (white: as drawn); night darkens it.
bookPaper = "#ffffff"
bookInk = "#2a1c10"
bookInkSoft = "#6b5538"
bookRubric = "#8f2716"
bookGold = "#e0bd72"
bookSepia = "#d8b98a"
bookCover = "#ffffff"
bookPaperNight = "#4a4d5a"
bookInkNight = "#efe3c8"
bookInkSoftNight = "#b7a98d"
bookRubricNight = "#f08f74"
# the reading settings (library.md 10.2): the backgrounds, inks and highlights a reader picks, the
# same in every theme; a test measures the contrast of every pair
# the drawn paper's mean colour (Media/Paper.tga, a test keeps it true): the contrast is
# measured against it
bookPaperTone = "#e3d3b0"
bookBgWhite = "#fbfaf6"
bookBgCream = "#f3e9d2"
bookBgGrey = "#d4d4d0"
bookBgGreen = "#cde6cf"
bookBgBlack = "#121212"
bookInkBlack = "#141414"
bookInkBlue = "#16306a"
bookInkWhite = "#f2efe8"
bookInkAmber = "#ffc871"
bookBlue = "#1f4fa3"
bookBlueNight = "#9cc2ff"

# round 4 (ADR 0038): colour by meaning. Services (on tiles, chips, badges and counts, never on names),
# the entity types, depth (the void behind the panes, a raised card, its light edge, the inner
# highlight), and the title bar's words.
svcVendor = "#5e4200"
svcQuest = "#594500"
svcTrainer = "#144b73"
svcInn = "#6a1ba0"
svcFlight = "#0f4f57"
svcRepair = "#504638"
svcFriendly = "#1d5220"
svcHostile = "#882018"
typeNpc = "#1d5220"
typeItem = "#144b73"
typeQuest = "#594500"
typeObject = "#63401e"
typeNode = "#0f4f57"
typeZone = "#2d4f2b"
typeRecipe = "#713900"
typeSpot = "#5e4200"
typeChain = "#6a1ba0"
typeHere = "#802b18"
void = "#3b2a1714"
card = "#fffaee8c"
cardEdge = "#3b2a172e"
inset = "#ffffff80"
headerText = "#2e2014"

# the kind tiles' eight groups (ADR 0046): value, hostile, place, nature, people, special, goods, other
tileGold = "#9c6f14"
tileRed = "#a4423b"
tileTeal = "#178f86"
tileGreen = "#3f8a45"
tileBlue = "#3b6fb6"
tilePurple = "#6b4aa8"
tileBrown = "#7a5a2e"
tileGrey = "#6f7780"

[shape]
radius = 6
radiusSmall = 4

# the widget set's sizes in px, the ground's alpha in % (ADR 0046, one look per theme)
[geometry]
action = 26
actionRow = 22
pill = 26
tab = 26
row = 28
tile = 18
tileBig = 26
gap = 6
groundAlpha = 92
