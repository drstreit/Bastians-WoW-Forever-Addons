# Parchment: a light theme to match the map art, ink on paper (ST3, ADR 0017).
id = "parchment"
name = "Parchment"
order = 2

[colors]
bg = "#e8d9b5f5"
panel = "#e0cfa6fa"
header = "#d2bd8f"
line = "#3b2a1740"
hover = "#3b2a171a"
press = "#3b2a1726"
faceHover = "#d8c497"
track = "#3b2a1714"
rule = "#3b2a1747"
divider = "#3b2a1726"
text = "#2e2014"
dim = "#5e4a33"
muted = "#655542"
bright = "#1a1008"
mapText = "#1a1a1a"     # words on the map, every style: place and zone names, pin names
mapTextDim = "#404040"  # the map's second words: a zone's level band, small places
mapTextRim = "#f5f1e6d9"  # the light rim around the map's words (dark ground)
accent = "#8c2f1a"
wayWanderer = "#a8551c"    # the welcome: the Wanderer's picture frame (warm; plan-launch-version 2.4)
wayScholar = "#1f5a96"     # the welcome: the Scholar's picture frame (cool)
gold = "#745200"
on = "#256521"
good = "#236427"
bad = "#a8281e"
warn = "#8a4500"
neutral = "#625645"
rare = "#7a1fb8"
water = "#185c8d"
# the six note colours of Bastian's Notes (notes.md, J), dark enough for the paper
note1 = "#735300"
note2 = "#1f6526"
note3 = "#185c8d"
note4 = "#783d9c"
note5 = "#8c4500"
note6 = "#9d3333"
chat = "#66ccff"
chatEmote = "#e8b47a"   # emote lines in the chat: sepia, the parchment of the scheme (L5)
tipText = "#ffffff"
tipDim = "#cccccc"
tipGold = "#ffd100"
diffRed = "#b01c1c"
diffOrange = "#8d430d"
diffYellow = "#695700"
diffGreen = "#256521"
diffGrey = "#60574b"
coinGold = "#715400"
coinSilver = "#57585e"
coinCopper = "#87471e"
sea = "#b8a380"
path = "#1f6fa8e6"
waypoint = "#3b2a1799"
waypointLoud = "#b36b00"
grid = "#3b2a1740"
# the Library's book (library.md 10.1): the same paper and ink in every theme, a book keeps its
# paper. The paper colours multiply the drawn paper (white: as drawn); night darkens it.
bookPaper = "#ffffff"
bookInk = "#2a1c10"
bookInkSoft = "#6b5538"
bookRubric = "#8f2716"
bookGold = "#e0bd72"
bookSepia = "#d8b98a"
bookCover = "#ffffff"
bookPaperNight = "#4a4d5a"
bookInkNight = "#efe3c8"
bookInkSoftNight = "#b7a98d"
bookRubricNight = "#f08f74"
# the reading settings (library.md 10.2): the backgrounds, inks and highlights a reader picks, the
# same in every theme; a test measures the contrast of every pair
# the drawn paper's mean colour (Media/Paper.tga, a test keeps it true): the contrast is
# measured against it
bookPaperTone = "#e3d3b0"
bookBgWhite = "#fbfaf6"
bookBgCream = "#f3e9d2"
bookBgGrey = "#d4d4d0"
bookBgGreen = "#cde6cf"
bookBgBlack = "#121212"
bookInkBlack = "#141414"
bookInkBlue = "#16306a"
bookInkWhite = "#f2efe8"
bookInkAmber = "#ffc871"
bookBlue = "#1f4fa3"
bookBlueNight = "#9cc2ff"

# round 4 (ADR 0038): colour by meaning. Services (on tiles, chips, badges and counts, never on names),
# the entity types, depth (the void behind the panes, a raised card, its light edge, the inner
# highlight), and the title bar's words.
svcVendor = "#745200"
svcQuest = "#6d5500"
svcTrainer = "#185c8d"
svcInn = "#7a1fb8"
svcFlight = "#12616a"
svcRepair = "#625645"
svcFriendly = "#236427"
svcHostile = "#a8281e"
typeNpc = "#236427"
typeItem = "#185c8d"
typeQuest = "#6d5500"
typeObject = "#7a4f25"
typeNode = "#12616a"
typeZone = "#376134"
typeRecipe = "#8a4500"
typeSpot = "#745200"
typeChain = "#7a1fb8"
typeHere = "#8c2f1a"
void = "#3b2a1714"
card = "#fffaee8c"
cardEdge = "#3b2a172e"
inset = "#ffffff80"
headerText = "#2e2014"

# the kind tiles' eight groups (ADR 0046): value, hostile, place, nature, people, special, goods, other
tileGold = "#9c6f14"
tileRed = "#a4423b"
tileTeal = "#178f86"
tileGreen = "#3f8a45"
tileBlue = "#3b6fb6"
tilePurple = "#6b4aa8"
tileBrown = "#7a5a2e"
tileGrey = "#6f7780"

[shape]
radius = 6
radiusSmall = 4

# the widget set's sizes in px, the ground's alpha in % (ADR 0046, one look per theme)
[geometry]
action = 26
actionRow = 22
pill = 26
tab = 26
row = 28
tile = 18
tileBig = 26
gap = 6
groundAlpha = 92
