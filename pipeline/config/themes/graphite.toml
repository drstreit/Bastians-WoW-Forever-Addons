# Graphite: the very modern scheme (plan-round4 H3, 01.11.2026): graphite surfaces, one vivid accent
# (electric violet; orange if the owner says so), 6 px windows, 4 px buttons, 16 px tiles, rows of 26.
id = "graphite"
name = "Graphite"
order = 6

[colors]
# surfaces
bg = "#15171bf2"        # window ground
panel = "#1c1f24fa"     # buttons, fields, menus
header = "#191c21"      # title bars, the dossier's band
line = "#ffffff1c"      # 1 px edges
hover = "#ffffff24"     # a row under the mouse
hoverBlock = "#a78bfa29" # the whole block of a row under the mouse
# the quest sheet (ADR 0053): parchment in every theme, a page of its own
sheetInk = "#2e2014"
sheetDim = "#57442f"
sheetTitle = "#802b18"
sheetGood = "#1d5220"
sheetLine = "#3b2a1747"
sheetTile = "#241b10"
sheetTileText = "#f3e6c8"
badgeInk = "#050505"       # the words on a light badge (a tile's level, ADR 0056)
badgeInkLight = "#ffffff"  # the words on a dark badge
sheetXp = "#9a35c8"
# Bastian's Book: its cards are paper in
# every theme, as the quest sheet; the words on them the paper's ink
folioPaper = "#e6d6b3"
folioPaperEdge = "#b99e6e"
folioInk = "#36281b"
folioInkSoft = "#6c5539"
folioFit = "#d8a44166"        # a level chip that fits you: the gold at 40 %
folioFitEdge = "#b8862c"
folioGold = "#d8a441"         # a ribbon or a word in the book's gold
folioSeal = "#a3332b"         # the new ribbon, the seal
folioSealText = "#f3e5c4"     # the words on the seal
folioShade = "#090705f0"      # the hero's words fade into this
folioShadeText = "#eadfca"    # words on the shade
folioShadow = "#00000073"     # the soft shadow under a card
folioLight = "#ffffff24"      # a tile's lit top edge: white at 14 %
folioDark = "#0000004d"       # a tile's foot in shade: black at 30 %
folioMat = "#8a5a36"          # the mat under a camp item
folioMatFoot = "#6b4326"      # the mat's foot: the gradient's other end
folioAlbum = "#d9c69c"        # the mat in an album's frame (the diary, R4.11)
# the book's dark table (ADR 0081, docs/addons/book-look.md section 3; "background
# color in wow schema should be same as artifact", D2 "WoW look only"): the same in every theme,
# painted by the book where the look is the game's; the other looks keep their own ground
folioTable = "#120e0b"        # the shelf's ground under the tiles
folioBand = "#1a1410"         # the filter band
folioBar = "#1a140f"          # the bar's foot
folioBarTop = "#2a2119"       # the bar's top: the gradient's other end
folioRule = "#4a3b2c"         # the rules under the bar and the band, a quiet chip's edge
folioText = "#eadfca"         # words on the dark table
folioMuted = "#a9987d"        # labels and counts on it
folioGoldInk = "#1b140c"      # words on a chosen chip, on the Atlas button
folioHover = "#2a2017"        # a quiet chip's plate under the mouse
press = "#ffffff1f"     # a pressed row
faceHover = "#272b32"   # a button's face under the mouse
track = "#ffffff0a"     # scroll and slider tracks
rule = "#ffffff2e"      # a rule row
divider = "#ffffff14"   # between two-line rows
# text
text = "#ececec"
dim = "#9aa0a8"         # secondary words, hints
muted = "#8b9199"       # grey words after a name
bright = "#ffffff"      # the strongest text (objectives, zone names)
mapText = "#1a1a1a"     # words on the map, every style: place and zone names, pin names
mapTextDim = "#404040"  # the map's second words: a zone's level band, small places
mapTextRim = "#f5f1e6d9"  # the light rim around the map's words (dark ground)
# a zone's level band on the map (A3.4): the difficulty colours' dark twins, readable on
# the light rim
mapDiffRed = "#a01c1c"
mapDiffOrange = "#9a4a0a"
mapDiffYellow = "#6e5a00"
mapDiffGreen = "#2a6a22"
mapDiffGrey = "#5c5c5c"
# accent and states
accent = "#a78bfa"
wayWanderer = "#e8a35c"    # the welcome: the Wanderer's picture frame (warm; plan-launch-version 2.4)
wayScholar = "#6aa9f0"     # the welcome: the Scholar's picture frame (cool)
gold = "#f2cd5c"        # worth, money, available quests
on = "#6bd98a"          # an icon that is switched on
good = "#6bd98a"        # verified, ahead
bad = "#f26d6d"         # refuted, behind, a loss
warn = "#f5a650"
neutral = "#b3b8bf"     # unverified
rare = "#c99cff"        # rare creatures
water = "#7fbcf7"       # fish, flight
# the six note colours of Bastian's Notes (notes.md, J)
note1 = "#f2cd5c"
note2 = "#8ad9a7"
note3 = "#6fcff2"
note4 = "#c99cff"
note5 = "#f5a650"
note6 = "#f26d6d"
# outside our windows (Blizzard's dark chat and tooltips: keep these light in every theme)
chat = "#66ccff"
chatEmote = "#f2a873"   # emote lines in the chat (L5)
tipText = "#ffffff"
tipDim = "#cccccc"
tipGold = "#ffd100"
# quest difficulty (the game's own scale)
diffRed = "#ff4e4e"
diffOrange = "#ff8040"
diffYellow = "#ffff00"
diffGreen = "#40c040"
diffGrey = "#8b9199"
# money letters
coinGold = "#f2cd5c"
coinSilver = "#c7c9ce"
coinCopper = "#eaa96c"
# the map
sea = "#6b6f78"          # under the art where no cell lies
path = "#a78bfae6"       # the route's line
waypoint = "#ffffff99"   # a quiet waypoint pin
waypointLoud = "#f2e05c" # the waypoint just set
grid = "#ffffff40"       # the debug grid of the imagery
# the Library's book (library.md 10.1): the same paper and ink in every theme, a book keeps its
# paper. The paper colours multiply the drawn paper (white: as drawn); night darkens it.
bookPaper = "#ffffff"
bookInk = "#2a1c10"
bookInkSoft = "#6b5538"
bookRubric = "#8f2716"
bookGold = "#e0bd72"
bookSepia = "#d8b98a"
bookCover = "#ffffff"
bookPaperNight = "#4a4d5a"
bookInkNight = "#efe3c8"
bookInkSoftNight = "#b7a98d"
bookRubricNight = "#f08f74"
# the reading settings (library.md 10.2): the backgrounds, inks and highlights a reader picks, the
# same in every theme; a test measures the contrast of every pair
# the drawn paper's mean colour (Media/Paper.tga, a test keeps it true): the contrast is
# measured against it
bookPaperTone = "#e3d3b0"
bookBgWhite = "#fbfaf6"
bookBgCream = "#f3e9d2"
bookBgGrey = "#d4d4d0"
bookBgGreen = "#cde6cf"
bookBgBlack = "#121212"
bookInkBlack = "#141414"
bookInkBlue = "#16306a"
bookInkWhite = "#f2efe8"
bookInkAmber = "#ffc871"
bookBlue = "#1f4fa3"
bookBlueNight = "#9cc2ff"

# round 4 (ADR 0038): colour by meaning. Services (on tiles, chips, badges and counts, never on names),
# the entity types, depth (the void behind the panes, a raised card, its light edge, the inner
# highlight), and the title bar's words.
svcVendor = "#f2cd5c"
svcQuest = "#f2e05c"
svcTrainer = "#7fbcf7"
svcInn = "#c99cff"
svcFlight = "#5fd8e2"
svcRepair = "#bcae97"
svcFriendly = "#6bd98a"
svcHostile = "#f26d6d"
typeNpc = "#6bd98a"
typeItem = "#7fbcf7"
typeQuest = "#f2e05c"
typeObject = "#dba96e"
typeNode = "#5fd8e2"
typeZone = "#9ad186"
typeRecipe = "#f5a650"
typeSpot = "#f2cd5c"
typeChain = "#c99cff"
typeHere = "#a78bfa"
void = "#0b0c0e99"
card = "#ffffff0a"
cardEdge = "#ffffff16"
inset = "#ffffff0f"
headerText = "#ececec"
tier0 = "#f2709a"         # the chat's ladder (plan-chat-v3.md §2.2): needs you
tier1 = "#8fb0f7"         # your people
tier2 = "#6bd98a"         # yours (loot, money, experience)
tier3 = "#f2cd5c"         # signals (Trade's offers, groups)
tier4 = "#8b9199"         # ambient
tier5 = "#6b7078"         # noise (junk)
cardHot = "#a78bfa"       # the edge of a fresh card (a request just arrived)
roleTank = "#8fc4f7"      # the roles of a group post, as words
roleHeal = "#7fe0a0"
roleDps = "#f59a92"
offerSell = "#a8e07a"     # an offer's kind as a word: WTS
offerBuy = "#f5c070"      # WTB
# the channels' colours (plan-chat-v3.md V25; the artifact's on a dark ground, twins on a light one)
chanWhisper = "#ff80ff" # whispers (the artifact's --c-whisper)
chanBnet = "#00faf6"    # Battle.net whispers
chanParty = "#aaaaff"   # the party and instance chat
chanRaid = "#ff7f00"    # the raid
chanWarning = "#ff5512" # raid warnings, moved 7%
chanGuild = "#40ff40"   # the guild
chanOfficer = "#40c040" # the officers
chanSay = "#ffffff"     # say
chanYell = "#ff5151"    # yell, moved 9%
chanEmote = "#ff8040"   # emotes
chanChannel = "#ffc0c0" # Trade, General, LFG and other channels
chanLoot = "#2fd466"    # loot and money
chanXp = "#a99cff"      # experience
chanRep = "#8fb3ff"     # reputation
chanSystem = "#ffff00"  # system lines, achievements
chanNpc = "#fffb9f"     # NPCs speaking

# the kind tiles' eight groups (ADR 0046): value, hostile, place, nature, people, special, goods, other
tileGold = "#a67c1e"
tileRed = "#a4423b"
tileTeal = "#1f8f87"
tileGreen = "#3f8a45"
tileBlue = "#3b6fb6"
tilePurple = "#7152b8"
tileBrown = "#7a5a2e"
tileGrey = "#5c6670"

[shape]
radius = 6       # windows, blocks, menus
radiusSmall = 4  # buttons, pills, fields

# the widget set's sizes in px, the ground's alpha in % (ADR 0046, one look per theme)
[geometry]
action = 26
actionRow = 22
pill = 26
chip = 22
tab = 26
row = 26
tile = 16
tileBig = 26
gap = 6
groundAlpha = 88
