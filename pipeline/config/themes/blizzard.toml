# Blizzard gold: black panels with gold edges and accents, like the game's own dialogs (ST3, ADR 0017).
id = "blizzard"
name = "Blizzard gold"
order = 3

[colors]
bg = "#050505eb"
panel = "#0d0b08f5"
header = "#1a150c"
line = "#ffd10040"
hover = "#ffd1001f"
press = "#ffd1002e"
faceHover = "#2a2112"
track = "#ffd1000f"
rule = "#ffd10047"
divider = "#ffd10024"
text = "#ffffff"
dim = "#bfbfbf"
muted = "#8c8c8c"
bright = "#ffffff"
mapText = "#1a1a1a"     # words on the map, every style: place and zone names, pin names
mapTextDim = "#404040"  # the map's second words: a zone's level band, small places
mapTextRim = "#f5f1e6d9"  # the light rim around the map's words (dark ground)
accent = "#ffd100"
gold = "#ffd100"
on = "#1eff00"
good = "#1eff00"
bad = "#ff2020"
warn = "#ff8000"
neutral = "#b3b3b3"
rare = "#a335ee"
water = "#0070dd"
# the six note colours of Bastian's Notes (notes.md, J)
note1 = "#f2c94c"
note2 = "#6fcf97"
note3 = "#56ccf2"
note4 = "#bb6bd9"
note5 = "#f2994a"
note6 = "#eb5757"
chat = "#ffd100"
tipText = "#ffffff"
tipDim = "#cccccc"
tipGold = "#ffd100"
diffRed = "#ff2020"
diffOrange = "#ff8040"
diffYellow = "#ffff00"
diffGreen = "#40c040"
diffGrey = "#808080"
coinGold = "#ffd700"
coinSilver = "#c7c7cf"
coinCopper = "#eda55f"
sea = "#b8a380"
path = "#ffd100e6"
waypoint = "#ffffff99"
waypointLoud = "#ffd100"
grid = "#ffffff40"
# the Library's book (library.md 10.1): the same paper and ink in every theme, a book keeps its
# paper. The paper colours multiply the drawn paper (white: as drawn); night darkens it.
bookPaper = "#ffffff"
bookInk = "#2a1c10"
bookInkSoft = "#6b5538"
bookRubric = "#8f2716"
bookGold = "#e0bd72"
bookSepia = "#d8b98a"
bookCover = "#ffffff"
bookPaperNight = "#4a4d5a"
bookInkNight = "#efe3c8"
bookInkSoftNight = "#b7a98d"
bookRubricNight = "#f08f74"
# the reading settings (library.md 10.2): the backgrounds, inks and highlights a reader picks, the
# same in every theme; a test measures the contrast of every pair
# the drawn paper's mean colour (Media/Paper.tga, a test keeps it true): the contrast is
# measured against it
bookPaperTone = "#e3d3b0"
bookBgWhite = "#fbfaf6"
bookBgCream = "#f3e9d2"
bookBgGrey = "#d4d4d0"
bookBgGreen = "#cde6cf"
bookBgBlack = "#121212"
bookInkBlack = "#141414"
bookInkBlue = "#16306a"
bookInkWhite = "#f2efe8"
bookInkAmber = "#ffc871"
bookBlue = "#1f4fa3"
bookBlueNight = "#9cc2ff"

[shape]
radius = 4
radiusSmall = 3
