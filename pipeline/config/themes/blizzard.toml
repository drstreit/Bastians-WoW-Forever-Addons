# Blizzard gold: black panels with gold edges and accents, like the game's own dialogs (ST3, ADR 0017).
id = "blizzard"
name = "Blizzard gold"
order = 3

[colors]
bg = "#050505eb"
panel = "#0d0b08f5"
header = "#1a150c"
line = "#ffd10040"
hover = "#ffd1001f"
hoverBlock = "#3f7fd433"
# the quest sheet (ADR 0053): parchment in every theme, a page of its own
sheetInk = "#2e2014"
sheetDim = "#57442f"
sheetTitle = "#802b18"
sheetGood = "#1d5220"
sheetLine = "#3b2a1747"
sheetTile = "#241b10"
sheetTileText = "#f3e6c8"
badgeInk = "#050505"       # the words on a light badge (a tile's level, ADR 0056)
badgeInkLight = "#ffffff"  # the words on a dark badge
sheetXp = "#9a35c8"
press = "#ffd1002e"
faceHover = "#2a2112"
track = "#ffd1000f"
rule = "#ffd10047"
divider = "#ffd10024"
text = "#ffffff"
dim = "#bfbfbf"
muted = "#8c8c8c"
bright = "#ffffff"
mapText = "#1a1a1a"     # words on the map, every style: place and zone names, pin names
mapTextDim = "#404040"  # the map's second words: a zone's level band, small places
mapTextRim = "#f5f1e6d9"  # the light rim around the map's words (dark ground)
# a zone's level band on the map (A3.4): the difficulty colours' dark twins, readable on
# the light rim
mapDiffRed = "#a01c1c"
mapDiffOrange = "#9a4a0a"
mapDiffYellow = "#6e5a00"
mapDiffGreen = "#2a6a22"
mapDiffGrey = "#5c5c5c"
accent = "#ffd100"
wayWanderer = "#ff9a3c"    # the welcome: the Wanderer's picture frame (warm; plan-launch-version 2.4)
wayScholar = "#4fa3ff"     # the welcome: the Scholar's picture frame (cool)
gold = "#ffd100"
on = "#1eff00"
good = "#1eff00"
bad = "#ff2020"
warn = "#ff8000"
neutral = "#b3b3b3"
rare = "#b440ff"
water = "#057cee"
# the six note colours of Bastian's Notes (notes.md, J)
note1 = "#f2c94c"
note2 = "#6fcf97"
note3 = "#56ccf2"
note4 = "#bb6bd9"
note5 = "#f2994a"
note6 = "#eb5757"
chat = "#ffd100"
chatEmote = "#ff8040"   # emote lines in the chat: the game's own emote colour (L5)
tipText = "#ffffff"
tipDim = "#cccccc"
tipGold = "#ffd100"
diffRed = "#ff2020"
diffOrange = "#ff8040"
diffYellow = "#ffff00"
diffGreen = "#40c040"
diffGrey = "#808080"
coinGold = "#ffd700"
coinSilver = "#c7c7cf"
coinCopper = "#eda55f"
sea = "#b8a380"
path = "#ffd100e6"
waypoint = "#ffffff99"
waypointLoud = "#ffd100"
grid = "#ffffff40"
# the Library's book (library.md 10.1): the same paper and ink in every theme, a book keeps its
# paper. The paper colours multiply the drawn paper (white: as drawn); night darkens it.
bookPaper = "#ffffff"
bookInk = "#2a1c10"
bookInkSoft = "#6b5538"
bookRubric = "#8f2716"
bookGold = "#e0bd72"
bookSepia = "#d8b98a"
bookCover = "#ffffff"
bookPaperNight = "#4a4d5a"
bookInkNight = "#efe3c8"
bookInkSoftNight = "#b7a98d"
bookRubricNight = "#f08f74"
# the reading settings (library.md 10.2): the backgrounds, inks and highlights a reader picks, the
# same in every theme; a test measures the contrast of every pair
# the drawn paper's mean colour (Media/Paper.tga, a test keeps it true): the contrast is
# measured against it
bookPaperTone = "#e3d3b0"
bookBgWhite = "#fbfaf6"
bookBgCream = "#f3e9d2"
bookBgGrey = "#d4d4d0"
bookBgGreen = "#cde6cf"
bookBgBlack = "#121212"
bookInkBlack = "#141414"
bookInkBlue = "#16306a"
bookInkWhite = "#f2efe8"
bookInkAmber = "#ffc871"
bookBlue = "#1f4fa3"
bookBlueNight = "#9cc2ff"

# round 4 (ADR 0038): colour by meaning. Services (on tiles, chips, badges and counts, never on names),
# the entity types, depth (the void behind the panes, a raised card, its light edge, the inner
# highlight), and the title bar's words.
svcVendor = "#ffd100"
svcQuest = "#ffff00"
svcTrainer = "#4aa3ff"
svcInn = "#c58cff"
svcFlight = "#4fd3e0"
svcRepair = "#c0b090"
svcFriendly = "#1eff00"
svcHostile = "#ff2020"
typeNpc = "#1eff00"
typeItem = "#4aa3ff"
typeQuest = "#ffff00"
typeObject = "#d9a066"
typeNode = "#4fd3e0"
typeZone = "#8fd07a"
typeRecipe = "#ff8000"
typeSpot = "#ffd100"
typeChain = "#c58cff"
typeHere = "#ffd100"
void = "#00000080"
card = "#ffd10009"
cardEdge = "#ffd10038"
inset = "#ffd10014"
headerText = "#ffd100"

# the kind tiles' eight groups (ADR 0046): value, hostile, place, nature, people, special, goods, other
tileGold = "#b8891f"
tileRed = "#a4423b"
tileTeal = "#1f8f87"
tileGreen = "#3f8a45"
tileBlue = "#3b6fb6"
tilePurple = "#6b4aa8"
tileBrown = "#7a5a2e"
tileGrey = "#5c6670"

[shape]
radius = 4
radiusSmall = 3

# the widget set's sizes in px, the ground's alpha in % (ADR 0046, one look per theme)
[geometry]
action = 24
actionRow = 20
pill = 26
tab = 24
row = 28
tile = 18
tileBig = 26
gap = 6
groundAlpha = 100
