# The Bastian map's styles (ADR 0027): the classes a ground texture or a model falls in by its
# listfile path (first match in table order), and per style its palette and strokes. Colours are
# "rrggbb". Read by tools/mapstyle; changing this file changes the map without touching code.

[render]
supersample = 2          # drawn at twice the pixels, then scaled down (smooth edges)
seed = 27                # the wavering strokes and the paper grain; fixed, so the build is reproducible

[ground]                 # texture path keywords -> class
road = ["cobblestone", "road", "/path"]
farmland = ["crop", "straw", "farm", "hay", "wheat"]
sand = ["sand", "beach", "coral"]
snow = ["snow", "ice"]
ash = ["ash", "charcoal", "burnt", "obsid"]
rock = ["rock", "cliff", "stone", "rubble", "gravel"]
dirt = ["dirt", "mud"]
leaf = ["leaf", "needle"]
grass = ["grass", "flower", "moss", "scrub", "brush"]

[models]                 # M2 path keywords -> class; others are props and not drawn
tree = ["/trees/", "tree", "canopy", "pine", "oak", "palm", "willow"]
bush = ["bush", "shrub", "fern", "/plants/"]
rock = ["rock", "boulder"]
fence = ["fence", "wallpiece", "/posts", "woodpost"]

[unnamed]                # models without a listfile name (Forever's new trees in Elwynn, 26.10.2026)
tree_min_height = 20     # yards of model box: taller ones count as trees
crown_share = 0.35       # of the box radius (the box holds the widest branch)

[buildings]
step = 1.2               # a line where the WMO tops rise this many yards per yard (eaves, ridges, walls)
roof_above = 2.5         # yards between an indoor floor and the top above it: a roof (else open sky)
under_roof = 2.5         # yards of WMO above a tree or a prop: it stands inside and is not drawn

[liquids]                # LiquidType name keywords -> class
lava = ["magma", "lava"]
slime = ["slime", "fel"]
sea = ["ocean"]
water = ["water", "river", "lake", "canal"]

