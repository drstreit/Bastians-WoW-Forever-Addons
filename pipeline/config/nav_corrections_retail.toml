# The correction table of the retail world graph's network (world-graph.md §6.1 step 4, data.md
# "Our authored tables"): what the collision mesh gets wrong. Read by `bastians_build nav`
# (corrections.py) before the network is built; every change is printed in the build's output.
#
# [[lift]]   name, continent (Map.db2 id), top = [wx, wy, wz], bottom = [wx, wy, wz] (world yards,
#            north +wx, west +wy), ride = seconds, cycle = seconds (optional: half of it is the
#            expected wait), verified = false | "date, build, how", note
# [[link]]   name, kind (ramp, stairs, tunnel, door, path), continent, a = [wx, wy, wz],
#            b = [wx, wy, wz], points = [[wx, wy, wz], ...] (optional), oneway (optional), verified, note
# [[block]]  name, continent, center = [wx, wy], r = yards: every way with an end inside goes
#            (forbidden ground: a gate, an invisible wall), verified, note
#
# Each end of a lift or a link joins the nearest waypoint that has ways (3D, within 100 yards), so
# the height picks the floor. Stops the mesh left without ways (a dock, a zeppelin tower) join
# their nearest connected waypoint within 40 yards without a row.
#
# The lift ends below are the CMaNGOS classic-db game objects (Undercity: the upper and lower lift
# doors, entries 20650/20651, 20653/20654, 20656/20657; elsewhere the two cabins, which start one
# at each end). Measured 25.10.2026 on the retail local levels (12.1.5.70448): without these rows
# Thunder Bluff's mesas cannot be reached from Mulgore at all and Undercity's top and bottom are
# about 2,600 yards apart. Retail keeps the Classic positions of these lifts (assumed: Undercity's
# ruins above were rebuilt, its top ends join 50 to 80 yards away); the Great Lift and Freewind
# Post are left out (Thousand Needles is flooded since Cataclysm). Rides and cycles are
# assumed (not timed); time them in game and write the date here.

