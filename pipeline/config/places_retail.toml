# when retail instances pay off.

# ============================================================================================
# Transports (moved here from transports_retail.toml on 25.10.2026, ADR 0026 W4)
# ============================================================================================
#
# Transports of the retail world (route.md, roadmap B9.1); the format is the one of
# places_forever.toml's transports. Still empty on 20.10.2026: the retail data sources are decided (B4.1) but
# none of them carries transport positions or times, and golden rule 1 forbids guessing them. The
# candidates for the two old continents (the planner's frame until Outland and later are in it) are
# listed in route.md "Transports"; each row is written after a measurement in game (`/way` at both
# ends, a stopwatch for ride and cycle), `verified = true` from the start.

# Teleports a character may have (route.md "Home and every way back", R26.7, 26.10.2026). `place`
# from CMaNGOS spell_target_position (the classic DB; retail redrew the cities, so assumed here);
# `verified` empty: not checked in game yet. Route learns the real landing when a teleport is cast
# and keeps it over the place below. Mage teleports use a Rune of Teleportation (17031) where the
# client still asks for it.

