# ============================================================================================
# Transports (moved here from transports_forever.toml on 25.10.2026, ADR 0026 W4)
# ============================================================================================
#
# Transports of the Forever world (route.md, roadmap B9.1): boats, zeppelins, the tram and portals.
# Authored by us from the Classic layout; every row stays `verified = false` until it was measured in
# game on Forever (position of both ends, ride time, loop time). HandyNotes: TravelGuide is a
# cross-check only (no licence, sources.md). Never bundle its data.
#
# Fields
#   id        stable key, lowercase with dashes
#   kind      "boat" | "zeppelin" | "tram" | "portal"
#   name      shown to the player
#   faction   "Alliance" | "Horde" | "both"
#   stops     [[uiMapID, x, y, label], ...] as map fractions (Forever uiMapIDs); a shuttle has two stops
#             and runs both ways
#   ride      seconds on board one way (omit when unknown; never 0)
#   cycle     seconds for one full loop, so the expected wait is cycle / 2 (omit when unknown)
#   verified  true once measured in game on this client
#   note      free text shown to the player, e.g. what is still an estimate
#
# Forever's TaxiNodes table (clientdump, build 1.60.1.70450) lists transport dummy nodes that name
# the routes the client knows: "Transport, Menethil Ships", "Transport, Rut'theran - Auberdine",
# "Transport, Booty Bay - Ratchet", "Transport, Orgrimmar Zepplins", "Transport, Grom'gol - Orgrimmar",
# "Transport, Feathermoon - Feralas", "Southshore Ferry, Hillsbrad", "Fishing Village, Teldrassil",
# "Powderfuse Port, Riverglades", "Tidegear Coast, Dun Morogh". The last five are new in Forever and
# had no row: 06.11.2026 the routes ForeverDB knows are below, still to measure in game (B9.1 owner
# check). ForeverDB has no route for "Fishing Village, Teldrassil" or "Tidegear Coast, Dun Morogh";
# Tidegear Coast is a flight master in its Data/Travel.lua (node 3205).

