# Hand-drawn dungeon maps (ADR 0048, data.md "Dungeons"): Santiago Reyes' "Atlas of Azeroth:
# Forever" maps, used with his permission (02.11.2026), replace the floors of Forever's own
# dungeons, which the client has no map of. The tiles are made by tools/dungeon_art.py into
# addons/Bastians_Core/Media/Dungeons/<art>_1..12.blp. Read by pipeline/bastians_build/
# dungeon_art.py for both clients (retail carries Forever's dungeons as a test client).
#
# The pins are ours, placed by hand on his maps (x, y in percent of the map, 0..100): the door is
# his entrance swirl; a boss stands in the room the public guides name for it (warcrafttavern.com,
# method.gg, read 02.11.2026; a handful of facts, ). A boss whose room the guides
# do not name or name differently gets no pin: the page counts it ("unknown is not zero").
# `verified = false` until the owner checked the pins in game on Forever.
#
#   [[dungeon]]
#   id = 2959                  # the instance's Map.db2 id (the dungeon record)
#   floors = [{ name = "...", art = "<key>", by = "santiago" }]
#   door = { floor = 1, x = 18.0, y = 85.0 }
#   bosses = [{ order = 8, name = "...", floor = 1, x = 67.5, y = 58.0 }]

[[dungeon]]
id = 2959
name = "City of Dalaran"
verified = false
floors = [
  { name = "Dalaran Sewers", art = "dalaran_sewers", by = "santiago" },
  { name = "City of Dalaran", art = "dalaran_city", by = "santiago" },
]
# the sewers' swirl, the Cantrips & Crows side (method.gg: "the sewers are where you start")
door = { floor = 1, x = 18.0, y = 85.0 }
bosses = [
  # The Underbelly, past the three large pipes (warcrafttavern)
  { order = 8, name = "Atrexis the Grave Knight", floor = 1, x = 68.0, y = 58.0 },
  # Krasus' Landing (both guides)
  { order = 1, name = "Arcane Anomaly", floor = 2, x = 52.5, y = 83.0 },
  # Runeweaver Square, the city's centre (both guides)
  { order = 2, name = "Fel Ancient", floor = 2, x = 54.5, y = 55.0 },
  # the Violet Hold (both guides)
  { order = 3, name = "Mana Devourer", floor = 2, x = 35.0, y = 82.0 },
  # the Violet Citadel (both guides)
  { order = 6, name = "Shade of the Archmage", floor = 2, x = 52.0, y = 20.0 },
]

