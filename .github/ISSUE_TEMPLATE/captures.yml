name: Share your captures
description: The walks, flight times and ride waits your game learned, for everyone's routes.
labels: ["captures"]
body:
  - type: markdown
    attributes:
      value: |
        In the game: Settings > Bastian's Data > **Copy my captures**, press Ctrl+C, paste the text
        below. It holds positions and times only, never a name. A walk two players captured becomes
        a route for everyone in the next Data edition; the build credits "n captures".
  - type: textarea
    id: capture
    attributes:
      label: The text from Copy my captures
      description: Paste it whole, from "BASTIANS CAPTURE" to the "END" line.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Sharing
      options:
        - label: The text holds positions and times only, and I am happy to share them under GPL-3.0 with Bastian's Data.
          required: true
