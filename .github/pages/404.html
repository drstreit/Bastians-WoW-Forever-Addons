<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bastian's Suite has moved</title>
<meta http-equiv="refresh" content="0; url=https://bastians.dev/wow/">
<meta name="robots" content="noindex">
<script>
  // GitHub Pages serves this page for every old address: the icons keep their path on
  // bastians.dev (media/...), everything else goes to the suite's page.
  (function () {
    var rest = location.pathname.replace(/^\/Bastians-WoW-Forever-Addons\/?/, "");
    var target = /^media\/[\w.-]+$/.test(rest)
      ? "https://bastians.dev/" + rest
      : "https://bastians.dev/wow/";
    location.replace(target);
  })();
</script>
<style>
body { margin: 0; background: #14110f; color: #ebebeb; font: 18px/1.5 system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
a { color: #0cd29d; }
</style>
</head>
<body>
<main>
<p>Bastian's Suite has moved to <a href="https://bastians.dev/wow/">bastians.dev/wow</a>.</p>
</main>
</body>
</html>
