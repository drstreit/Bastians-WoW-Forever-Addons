# The old website address (GitHub Pages): since 24.10.2026 the site lives on bastians.dev
# (Cloudflare Pages, tools/site_deploy.py), and this address only forwards to it: .github/pages
# holds the forward and a 404 page that sends every old link (the icons in media/ too) along.
name: Website forward

on:
  push:
    branches: [main]
    paths:
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the forward
        run: mkdir -p _site && cp -r .github/pages/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
