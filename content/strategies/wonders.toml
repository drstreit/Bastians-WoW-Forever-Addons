# Bastian's own lines for the book's wonders (docs/addons/book.md "The data"), by wonder id.
# A wonder without one speaks with its source's sentence. The voice and the canon: bastian.md.
# Bastian is human: the Horde's places he knows only from what he heard (bastian.md "How he travels").
# The steps are Nixie's envelope: a line here never tells them.

[hooks]
"chain:sleeping-bag" = "I have slept in more barns than most cows. Then a charred note in a burned-out farmhouse promised me a bed I could unroll anywhere, and I have not slept in a barn since. Well, twice."
"chain:keystone-fragment" = "Nobody has solved this one. Not the travellers, not Nixie, and not me, although I came very close one evening. A stone key that opens nothing is still a key."
"chain:lyn-the-ignored" = "Somewhere in Dalaran a woman called Lyn waits for someone to read the right book. I can read. I only have to get the book away from Arugal first."
"chain:silver-of-the-waves" = "Somebody dropped a hair clip into Loch Modan, and somebody has to go down and fetch it. Nixie says I hold my breath for a living. I think she means something else."
"chain:library-books" = "A librarian who pays in rings for books you find lying about. I have found many things lying about. Most of them were not books."
"chain:bloody-map" = "A Horde trail, so I know it only from a man in Menethil who would not finish his story. It ends with a map drawn in blood. I would like to know where it leads, from a safe distance."
"chain:musical-gustjumper" = "They say the frogs on Zephras Isle follow anyone who sings to them. I have a fine voice. I have been told so, by my mother."
"chain:excitable-slime" = "A slime in the canals of the Undercity, for the Horde and for anyone braver than me. I am told it likes to dance. So do I, but nobody ever fed me for it."
"chain:camping-elwynn" = "Sam Sarsaparilla keeps a fire in Goldshire, my Goldshire, and whoever sits by it rests better. I have sat by fires in Goldshire all my life. Nobody told me it was a quest."
"chain:camping-dun-morogh" = "The dwarves at Coldridge Pass taught me what a campfire is for: warmth first, then supper, then a song nobody asked for."
"chain:camping-teldrassil" = "In Shadowglen even the campfire is polite. You sit, you rest, you learn to cook, and nobody asks about your bill."
"chain:camping-zephras" = "On Zephras Isle the wind takes your hat and leaves you the fire. Aetheen of the Gales teaches you the rest."
"chain:camping-durotar" = "In the Valley of Trials, they say, a young orc learns the fire before the axe. I heard it in Ratchet over a long evening, and I believe every word."
"chain:camping-tirisfal" = "Even in Deathknell somebody keeps a fire going. I find that a comfort, though I have never been and do not plan to go."
"chain:camping-mulgore" = "At Camp Narache the fire is older than the camp, a tauren in Ratchet told me. He also told me I talk too much."

# The drawings' scene lines (D5 option b, docs/addons/book.md "Pictures"; 17.11.2026): one per
# wonder without a model and per chapter's entrance (`chapter:<name>`). tools/book_drawings.py
# draws from them at 2K with the style and the characters of art/README.md; the pipeline holds
# them as it holds a page's `scene` (ASCII, no dash as punctuation).
[scenes]
"book:203754" = "Low angle from the flagstones of a vast dwarven stone hall in Ironforge, lit by the orange glow of distant forges: Bastian, knees bent and face red with determined effort, hauls a ridiculously thick, brass-cornered tome off a low shelf while a stocky dwarf librarian watches with folded arms."
"book:203755" = "Seen through the arched window of a wizard's tower room above the green treetops of Elwynn Forest: Bastian stands at a desk crowded with glass instruments and holds a slim leather journal upside down, puzzled, one eyebrow up, a quill stuck behind his ear; dusty afternoon sunbeams."
"book:207972" = "Detail shot of Bastian's big, scratched hands holding a small book bound in bark and tied with beads and bright feathers, a carved wooden troll mask and a palm trunk out of focus behind on a hot red-sand shore; hard noon light, the shadow of palm leaves across his sleeves. We do not see his face."
"book:208185" = "Wide landscape of a gloomy plagued village of crooked houses and sickly green lanterns under a brown sky in Tirisfal Glades: far outside it, small behind a dead tree on a hill, Bastian peers through a dented spyglass at a mouldy book left on a windowsill, wary, ready to run; cold dusk."
"book:208800" = "Medium shot in the dry yellow savanna of the Barrens: in the middle of a perfectly round patch of scorched grass Bastian holds a singed, still smoking book at arm's length between two fingers, uneasy, leaning as far away from it as his arm allows; flat-topped trees, white midday heat."
"book:208860" = "Close-up on the pebbled shore of the great lake of Loch Modan: Bastian holds a book no bigger than his thumbnail between two thick fingers and reads it through a cracked magnifying glass, squinting hard, tongue between his teeth; a huge grey stone dam far behind; bright cool morning."
"book:209843" = "Side view on the misty, dark coast of Darkshore: Bastian wades knee-deep among toppled marble columns of a drowned elven ruin and lifts a swollen, dripping almanac out of the water, miserable, a small crab clinging to its corner and seaweed on his shoulder; grey violet twilight."
"book:209844" = "High angle onto the porch of a timbered house in the mage village of Ambermill among the foggy pines of Silverpine Forest: Bastian, sheepish, on tiptoe, slides one thin booklet out from the bottom of a tall string-tied stack while a violet-robed mage sweeps the step with his back turned."
"book:209845" = "Medium close-up in a golden Westfall wheat field: Bastian sits against a scarecrow with a glittering, rose-coloured book open on his knees and studies his reflection in the back of his rusty spoon, hopeful, smoothing his beard; faint sparkles drift up from the pages; warm evening sun."
"book:209846" = "Top-down view of a mossy clearing under a giant tree in the wilds of Kalimdor: Bastian lies flat on his back among the roots, fast asleep, a leaf-green book open across his chest and his mouth open, while a small owl and two rabbits sleep against his side; dappled green light, glowing motes."
"book:209847" = "Over Bastian's shoulder in the hot Barrens savanna: in his hands a manual open at a diagram of circles, gears and arrows, which he turns sideways to compare with a humming crystal contraption half buried in the dust ahead; he scratches the back of his head. We do not see his face."
"book:209848" = "Medium shot in pouring rain in the Wetlands marsh: Bastian hugs an armful of old scrolls under his cloak, alarmed, as one unrolls from his grip and trails away across a puddle towards a crocodile-like swamp beast that watches with one eye above the water; grey green light."
"book:209849" = "Close-up by lantern light in a crooked graveyard in the black woods of Duskwood: Bastian opens a book bound in stitched leather with a bone clasp just a crack and peeks in with one eye shut, queasy, lips pressed tight, cheeks a little green; fog, leaning headstones behind."
"book:209850" = "Medium close-up in a dwarven dig above Loch Modan: Bastian kneels over a heavy book with stone covers whose carved angular marks glow blue and light his face from below, awed, mouth open, one finger hovering, not daring to touch; scaffolding and a snoring dwarf digger in the dusk behind."
"book:209851" = "Wide landscape of the jagged red peaks of the Stonetalon Mountains under a thunderstorm: small, with his back to us, Bastian crawls up a bare windy ridge towards a book lying open on the summit rock, its pages whipping in the gale; lightning behind the clouds. We do not see his face."
"book:210177" = "Side view in the misty pine woods of Silverpine Forest: Bastian jumps with one arm stretched, exasperated, teeth bared, for a softly glowing book that hovers just above his fingertips over a cracked stone table, while an owl on a branch watches the third attempt; blue evening fog."
"book:213165" = "Wide view of a clearing in the Stranglethorn jungle: Bastian sits on a root, engrossed in a mottled, scaly book, chin in his hand, and does not notice the big six-legged basilisk lizard staring at him from the ferns, nor the mossy stone statue of an earlier reader beside him; green gold light."
"book:215816" = "Seen through a curtain of cobwebs in the dusty attic of an old inn: Bastian, suspicious, eyes narrowed, pokes with a broom handle at a book wrapped in spider silk on a beam, on which a fat spider sits like an owner; one shaft of light from a hole in the roof, dust in the air."
"book:215817" = "Over the shoulder of a small grinning imp perched on a rock: in front of it Bastian sits in the grey, barren waste of Desolace and studies a cheerful little handbook, earnest, moving his lips, quite unaware of his reader; pale bone-coloured hills, a flat hazy sun."
"book:215820" = "From behind a dwarf prospector who has dropped his pickaxe in fright: facing him in a dry red canyon of the Badlands stands Bastian, wound from head to knee in old linen wrappings that came off a bandaged book, embarrassed, one free hand raised in greeting; harsh sun, long shadows."
"book:215822" = "High angle onto a muddy bank in Dustwallow Marsh: Bastian sits on an upturned bucket and reads aloud from a book made of fish skin, seaweed and shells, proud, chest out, one finger raised, to three goggle-eyed murlocs who sit in a row like schoolchildren; grey mist, reed huts."
"book:215824" = "Medium close-up at the hearth of a country inn: Bastian kneels, a dog-eared handbook in one hand, and holds out a saucer of milk to a small scowling imp curled in a dog basket, patient, smiling kindly, although the cuff of his sleeve is quietly smoking; warm firelight."
"book:228132" = "From inside a dark farm cellar, between heaps of sprouting potatoes whose pale shoots reach out like little arms: on the stairs Bastian backs away upwards, spooked, eyes wide, a soil-stained book clutched to his chest and a lantern held out in front; daylight in the doorway above."
"camp:279938" = "Low angle from the grass of a forest camp: Bastian tugs with both hands at his belt pouch, which is caught fast in the padded spring trap on his new trapper's workbench, sheepish, glancing round to see who is watching; a rabbit sits safely beside the campfire; soft morning light."
"camp:279940" = "Close-up at a small folding table of vials at his camp in a damp jungle: Bastian holds two identical green bottles, one in each hand, nervous, looking from one to the other and biting his lip, while a small snake in a glass jar watches with interest; flickering firelight."
"camp:279941" = "Wide view of his camp on a windy hillside: a tall wooden tanning rack built for an ox hide, and laced in its middle one hide the size of a handkerchief, which Bastian presents with a sweep of his arm, proud, chin up, to a passing shepherd and his unimpressed dog; late sun."
"camp:279943" = "Medium close-up beside the campfire: a spinning wheel whirls and Bastian, startled, eyes wide, is being reeled in by his own beard, which has got into the thread, both hands braced against the frame; a ball of lumpy grey yarn on the ground; evening, sparks from the fire."
"camp:279944" = "Detail shot of a foot-driven sharpening wheel at his camp at night: Bastian's big hands press his old rusty spoon to the spinning stone with great care, and a fan of orange sparks lights his patched sleeves and one worn boot on the treadle; his blunt sword lies forgotten. We do not see his face."
"camp:279945" = "High angle onto a treadle sewing machine set up on a crate at his lakeside camp: Bastian has just lifted his arm and found his own sleeve neatly stitched to the piece of leather, dismayed, mouth open, the needle still going; cut scraps everywhere, a duck looking on; noon light."
"camp:279948" = "Wide view of a neat square of raked gravel with five ordinary rocks beside his campfire in dry hills: Bastian, patient, squats with a watering can and waters the biggest rock like a seedling, his pickaxe laid ready on a cloth; early morning, long shadows, one lizard looking on."
"camp:279951" = "Medium shot at his camp at the edge of a foggy wood: Bastian wears a long-beaked plague doctor's mask and a waxed apron and stirs a steaming poultice at a small bench of jars and herbs, while a sparrow has settled on the beak; grey dawn, a thin thread of smoke. We do not see his face."
"camp:279952" = "Close-up in the orange glow of a small stone foundry at his mountain camp: Bastian, content, eyes half closed, toasts a sausage on a long stick over the crucible of molten metal as if it were a kitchen fire, the tips of his beard just starting to curl; snow falling in the dark behind."
"camp:279955" = "Wide view of a huge, chimneyed master forge that dwarfs his little tent and campfire on a moor: Bastian hangs with his whole weight on the bellows handle, grinning, hair and beard blown straight back by the blast of heat, one very crooked nail cooling on the anvil; red glow against a blue dusk."
"camp:279956" = "Close-up at a small stone well that shines blue from inside, at his camp at night: Bastian has just drunk from the ladle and stares cross-eyed, astonished, at his own beard, which now glows a soft blue and stands out in all directions; moths gather round him; dark trees."
"camp:279957" = "Top-down view of a checked blanket in a meadow, crowded with pies, roast fowl, bread, cheese and a steaming pot: Bastian sits at its edge with a napkin tucked into his chain mail, knife and fork raised, delighted and unable to choose, while a raccoon makes off with a drumstick; sunny noon."
"camp:279959" = "Over Bastian's shoulder at a big frame loom beside his campfire in a birch wood: the cloth he is weaving starts wide and grows narrower and more crooked with every row, and his own bowstring has somehow been woven into it; his fingers hesitate over the shuttle; soft afternoon light. We do not see his face."
"camp:279960" = "Medium shot of a dark standing stone at his camp in rocky hills: Bastian hangs stuck to it by his chain mail, feet off the ground, resigned, his spoon and buckles clinging beside him, while Nixie digs in her heels and hauls back on her coin purse, which strains towards the stone; evening light."
"camp:279961" = "High angle onto a tidy stone-ringed campfire with a spit and a kettle hook in a forest glade, an open kit crate beside it: Bastian sits on his heels and turns one leftover iron part over in his hands, puzzled, looking from it to the finished fire and back; cool blue dusk, first flames."
"camp:279962" = "Medium close-up at dusk in a quiet glade: Bastian sits cross-legged before a fat incense candle, serene, eyes shut, one finger raised like a wise man, while a curl of scented smoke winds straight up his nose and his face begins to gather for an enormous sneeze; violet light."
"camp:279964" = "Seen through the steamed-up panes of a glass greenhouse hardly bigger than a wardrobe, set up beside his campfire: Bastian is folded inside among the seedlings, cheek pressed flat against the glass, cheerful all the same, tipping a tiny watering can over one sprout; drizzle outside."
"camp:279965" = "Low angle from the wet sand of a beach camp: beside a wooden rack of rods, nets and feathered lures Bastian turns in a circle, exasperated, trying to reach the hook that has caught the back of his own pauldron, fishing line looped round his arms and ears; gulls, a flat silver sea."
"camp:279966" = "Wide landscape of a frozen mountain lake under a pale winter sun: in the middle of the ice stands a tiny plank fishing hut with a smoking stovepipe, and out of its low door stick two long legs in much-mended boots, a rod propped between them over the ice hole. We do not see his face."
"camp:279967" = "Seen through the curved glass of a small fish bowl on a tree stump at his camp: Bastian's face, swollen wide by the water, stares nose to nose at one unbothered goldfish, fascinated, eyes huge, mouth making the same round shape as the fish; campfire glow behind him."
"camp:279968" = "Medium shot on a log beside an unpacked first aid kit: Bastian holds up his left hand, bandaged into a white ball the size of a cabbage, stoic, jaw set like a wounded hero, while his other hand still pinches the tiny splinter that started it; rolls of linen all around; morning sun."
"camp:279969" = "Low angle from a large paw print in the mud: Bastian crouches over it with an open field guide full of animal drawings, absorbed, finger on the page, comparing shapes, while behind his back the brown bear that made the print sniffs at his camp chair; misty forest morning."
"camp:279970" = "Medium close-up at a bubbling copper fermenter with crooked pipes beside his campfire: Bastian tastes from a wooden ladle, tipsy, cheeks pink, eyes drifting in two directions, a lopsided smile, foam in his beard; the cork lies in the grass; warm lantern light."
"camp:279972" = "Wide landscape of red desert mesas at sunset: beside a lonely campfire a tall red banner with a jagged black emblem snaps in the wind, a big tauren dozing under it, and far to the left, small in the dry grass, Bastian creeps past on hands and knees, wary, eyes fixed on the sleeper."
"camp:279973" = "Low angle at his camp on a green hill: Bastian stands at attention before a blue banner with a golden lion that he has just planted, hand on his heart, moved, eyes shining and chin trembling, while the crooked pole slowly leans further and further towards the campfire; dawn sky."
"camp:279974" = "Top-down view of a great stone campfire ringed so tightly by a tent, an anvil, a loom, a well, an oven, a banner and four more contraptions that no ground is left: in the last free spot Bastian stands on one leg, overwhelmed, bowl of stew in hand, looking for a place to sit; firelight."
"camp:279976" = "Side view by the campfire in a moonlit wood: a lute hangs in the air and plays itself, strings glimmering, and Bastian sways beside it on his log, dreamy, eyes half shut, conducting with a wooden spoon, while a squirrel on a branch holds its paws over its ears; blue night, golden sparks."
"camp:279978" = "Close-up at the mouth of a small patched tent at dawn: Bastian's head and shoulders stick out of the front because the tent is far too short for him, fast asleep, cheek on his folded arm, dew in his beard and a hedgehog curled up in his hair; pink light, wet grass."
"camp:279979" = "Medium shot at his camp in a meadow: the folding camp chair has snapped shut with Bastian in it and he sits wedged, knees up by his ears, indignant, arms crossed, refusing to call for help, a mug of tea still upright in his hand; two cows look on over a fence; soft afternoon."
"camp:279981" = "Detail shot in drizzle at the edge of a wood: Bastian's big hands cupped round a ring of pebbles and a wisp of tinder where one orange spark has just caught, the tips of his beard and his puffed breath entering from above, an open kit box and a wet flint beside his knee. We do not see his face."
"camp:279982" = "From inside a black iron oven, past a tray of buns burnt to small smoking lumps: Bastian's face peers in through the open door, crestfallen, eyebrows singed, an oven cloth over his shoulder, his camp and a grey rainy heath behind him; the red glow of the coals lights him from below."
"camp:279985" = "Over Nixie's shoulder at his camp: she turns one tiny glowing shard under her jeweller's loupe, unimpressed, while beyond her Bastian stands beside a humming crystal machine that has just eaten his spare boot, expectant, hands open for the verdict, one foot in a sock; violet glow, dusk."
"camp:279987" = "Medium close-up at a forge that burns with cold violet flames at his camp: Bastian holds up the sausage he meant to roast, now turned to clear sparkling crystal on its stick, dumbfounded, mouth open, frost on his eyebrows; purple light on his face, dark pines behind."
"camp:279988" = "High angle onto an anvil on a tree stump at his roadside camp: Bastian has hammered his dented pauldron and made the dent deeper, and now sucks his thumb, wincing, one eye shut, the hammer dropped in the grass; his horse looks the other way; bright morning."
"camp:279989" = "Wide view of a cluttered workbench of gears, fuses and small powder kegs in a round patch of blackened grass: Bastian stands in the middle of it, dazed, face sooty, hair smoking gently and standing on end, holding only the handle of a wrench; bits of metal still falling; clear afternoon."
"camp:279990" = "Low angle at a camp table of bubbling retorts and coloured flasks: Bastian floats a foot above the grass, slowly tipping sideways, worried, one hand gripping the table leg and the other still holding the empty test bottle; his pouches drift upwards; green and amber glow at night."
"chain:bloody-map" = "Over the shoulder of a hooded stranger who rises from a tavern table in rainy Menethil Harbor, his story unfinished: across the table Bastian half stands, pleading, one hand stretched out to stop him, and between them lies a rough sketch of a marsh drawn with a finger in spilled red wine; candlelight."
"chain:camping-dun-morogh" = "Wide view of a campfire in the snow outside a dwarven village in the white valley of Dun Morogh: Bastian stands with one boot on a log and sings, cheerful, eyes shut, arms spread, while four dwarves in furs hunch over their supper bowls and pull their caps down over their ears; blue dusk."
"chain:camping-durotar" = "Medium shot on the lamp-lit dock of the goblin port of Ratchet at night: an old one-eyed orc traveller draws a campfire in the air with both hands, and opposite him Bastian sits on a coil of rope, awed, chin on his fists, believing every word; the red rocky hills of Durotar dark across the water."
"chain:camping-elwynn" = "High angle onto the green in front of the Goldshire inn in Elwynn Forest: Bastian sits by the public campfire as he always has, mug in hand, puzzled, looking up at a patient queue of young adventurers who all wait for a turn on his log; warm evening, lanterns, big oaks."
"chain:camping-mulgore" = "From behind the broad furred back and horns of a huge tauren seated at a fire on the shore at Ratchet: facing him Bastian talks on, eager, both hands in the air and mouth wide open, quite unaware that the tauren's ears have drooped and his head has sunk into his hand; starry night, quiet sea."
"chain:camping-teldrassil" = "Medium shot under the giant violet trees of Teldrassil: Bastian leans back by a small, neat campfire ringed with white stones, content, boots off, a bowl of soup on his knee, while a tall night elf sentinel politely tends the pot and asks him nothing; soft blue light, drifting wisps."
"chain:camping-tirisfal" = "Wide landscape of a plagued graveyard village in Tirisfal Glades under a sickly green sky, bare trees, a crooked chapel, leaning headstones: in the middle of it one small warm campfire with a kettle and an empty stool, the only friendly light. No people, and Bastian is not in the picture."
"chain:camping-zephras" = "Low angle on a windswept grassy clifftop of Zephras Isle: Bastian, startled, grabs with both hands at his floppy hat as the gale carries it off over the sea, hair and beard streaming sideways, while behind him a campfire in a ring of stones burns on untroubled; racing clouds, bright light."
"chain:excitable-slime" = "Wide view of a goblin port tavern in the evening: Bastian dances a hopping jig in the middle of the floor, carefree, elbows out, practising for a slime he has only heard about, and his partner is a bowl of green jelly on a stool that wobbles in time; sailors stare over their mugs; lamplight."
"chain:keystone-fragment" = "Close-up at a tavern table late at night: Bastian, stumped, chin on the table, stares at a rough grey stone key lying in front of his nose, beside it the padlocks, a bird cage and a small chest it did not open, while Nixie's green hand reaches in, palm up, for the price of the candle; one low flame."
"chain:library-books" = "From behind the desk of a grey-robed librarian in a book-lined room in Stormwind City: Bastian has emptied his sack on the desk, a horseshoe, a turnip, an old boot, a bent candlestick and one single book, and looks up, hopeful, beaming as if all five counted; dusty window light."
"chain:lyn-the-ignored" = "Seen through a half-open oak door in a dark castle in Silverpine Forest: a black tome lies on a lectern in a pool of moonlight, and round the far doorpost peers Bastian, nervous, biting his knuckle, while the tall shadow of a robed wizard slides across the wall between him and the book."
"chain:musical-gustjumper" = "Wide view of a breezy pond on Zephras Isle: Bastian stands on the bank and sings with his whole chest, blissful, eyes closed, one hand on his heart, while a dozen frogs leap for the water in every direction and only one small frog sits at his boot and gazes up in admiration; bright noon."
"chain:silver-of-the-waves" = "Underwater view in the green depths of the lake of Loch Modan: Bastian swims down with cheeks blown out and eyes bulging, determined, hair floating upwards, one hand reaching for a rusty toolbox half sunk in the mud, while a large trout inspects his boots; shafts of sunlight from above."
"chain:sleeping-bag" = "High angle onto a moonlit field in Westfall: Bastian lies fast asleep in a plump quilted bedroll, only his nose and beard out, smiling in his sleep, a few steps from a barn whose door stands open and from which three cows stare at him, a little offended; stars, silver grass."
"title:1017" = "Side view on the grey dusty plain of Desolace: a line of big, war-painted centaurs trots past and at its tail Bastian trots too, proud, chest out, knees high, a horsehair broom tied to his belt for a tail, keeping step on two legs as well as he can; a low hazy sun, dust."
"title:1018" = "Medium shot at a ring of standing stones in the grey hills of Desolace: an old centaur elder with painted arms hangs a clan necklace of heavy carved stones round Bastian's neck and it pulls him into a deep bow, solemn, eyes on the ground, trying to make it look intended; firelight, dusk."
"title:1224" = "Close-up at an inn table: Bastian swirls a bubbling purple flask like a fine wine and sniffs it, smug, eyes closed, little finger out, an alchemist's stained apron over his chain mail, while the fumes have already dyed the lower half of his beard violet; candlelight, a wilted herb in a vase."
"title:1225" = "Low angle in a village smithy: Bastian poses at the anvil with a hammer on his shoulder and one boot on a bucket, proud, chin high, in a leather apron far too wide for him, and holds up his first horseshoe, which is twisted like a pretzel; the old smith hides a smile; forge glow."
"title:1227" = "High angle onto a moonlit inn yard: Bastian in his socks, a softly glowing rod still raised in his hand, watches, dismayed, mouth open, as his freshly enchanted boots walk away across the cobbles on their own, leaving small shining footprints towards the gate; a cat follows them."
"title:1228" = "Medium close-up at a cluttered workbench: Bastian wears brass goggles so thick that his eyes look as big as saucers, gleeful, showing all his teeth, and holds a wrench in triumph while his clockwork chicken marches off the edge of the table; three leftover screws in his other palm; lamplight."
"title:1229" = "Side view in a market street: Bastian walks very upright in brand-new leather trousers of his own making, far too tight, dignified, chin up, legs stiff as stilts, unable to bend a knee to climb the single step in front of him; a tanner and two children watch from a stall; noon sun."
"title:1230" = "Medium shot in a tailor's back room: Bastian stands before a tall mirror in a linen shirt he has sewn himself, which has three sleeves, perplexed, pins between his lips, a measuring tape round his neck, holding out the spare sleeve and counting his arms; bolts of cloth, window light."
"title:1258" = "High angle into a muddy trench behind a row of army tents with blue and gold lion banners: Bastian stands in it to his waist with a shovel, resigned, rain dripping from his nose, while at the rim a line of soldiers already waits with crossed legs for the latrine to be finished; grey morning."
"title:1259" = "Wide view of a castle drill yard under blue and gold lion banners: Bastian marches up and down before his whole command, two yawning recruits and a brown hen, stern, finger raised, and the hen is the only one in step; long morning shadows, a bored guard on the wall."
"title:1260" = "Close-up on a parade ground: Bastian, bellowing, mouth as wide as it goes, eyes screwed shut, face red, his helmet strap straining, and the blast has blown the feather off a recruit's cap at the edge of the picture and sent pigeons up from a blue and gold lion banner; hard noon sun."
"title:1261" = "Over the shoulder of a spotless young recruit standing to attention with a mirror-bright shield: Bastian, severe, lips pursed, runs a gloved finger along the shield rim looking for dust, he himself the shabbiest man on parade, one pauldron dented and patched; blue and gold lion banners, clear morning."
"title:1262" = "Top-down view of a paved parade square with a golden lion inlaid in blue stone: a column of soldiers wheels neatly to the right while at its head one broad figure with a long pace stick, Bastian, strides off to the left alone; long shadows across the stones. We see the top of his helmet; we do not see his face."
"title:1263" = "Side view in a stable yard: Bastian in a knight's tabard sits backwards on a tall grey warhorse, bewildered, holding the tail where he expected reins and peering down for the head, while the horse turns to look at him with heavy patience and a stable boy bites his lip; morning light, straw."
"title:1264" = "Medium close-up in a stone chapel hung with a blue and gold lion banner: Bastian kneels to be knighted and, as the flat of a sword comes down towards his shoulder, he is flinching, eyes squeezed shut, shoulders up to his ears, teeth clenched; coloured window light, the officer seen only as an arm."
"title:1265" = "Low angle on a tournament field with blue and gold pennants: Bastian on a trotting horse has just struck the wooden practice dummy with his lance and turns to the stands, beaming, fist raised, not seeing the dummy's sandbag swing round on its arm towards the back of his head; bright summer day."
"title:1266" = "Wide view of a stone harbour with blue and gold lion pennants: Bastian stands in the bow of a small rowing boat, one boot on the prow, resolute, arm pointing out to sea, while his two rowers pull in opposite directions and the boat draws a perfect circle on the water; gulls, morning haze."
"title:1267" = "Over the shoulder of a clerk holding out yet another armful of scrolls: behind a desk buried in rolled papers and dripping candles sits Bastian, harried, ink on his beard, a quill in each hand and a third behind his ear, a queue of soldiers reaching out of the door; a blue and gold lion banner on the wall, lamplight."
"title:1268" = "Side view on the steps of a great stone keep: Bastian strides out to review the troops in a long blue cloak edged with gold, baton under his arm, undaunted, chin first, and goes nowhere, leaning at a steep angle, because the heavy door has shut on the hem behind him; the guards look straight ahead; sunny morning."
"title:1269" = "Wide landscape of rolling green hills with a distant camp of blue tents: on a knoll Bastian sits on a folding stool and directs with two signal flags, satisfied, nodding, while the army marches away over the far ridge and a flock of sheep has formed neat ranks in front of him instead; breezy afternoon."
"title:1270" = "Top-down view of a war room: a map table as large as a barn floor covered in tiny painted figures, and Bastian lies across it on his stomach, boots in the air, determined, tongue out, stretching a long wooden rake towards one figure still out of reach; officers wait round the edge; candlelight."
"title:1271" = "Low angle in red desert scrub: Bastian crouches behind a cactus half as wide as he is, pauldrons and bow sticking out on both sides, smug, a finger to his lips, sure that he is invisible, while right beside him a lean orc scout crouches too and studies him with open curiosity; evening light."
"title:1272" = "Over the shoulder of a huge orc grunt who carries a crate on one arm like a loaf of bread: on a goblin dock behind him Bastian tries to lift the twin of that crate, grimacing, face purple, knees shaking, the crate not one finger off the planks; a red banner with a black emblem hangs from the ship; hot noon."
"title:1273" = "Medium shot on a dusty road outside a goblin port: a line of orc and troll recruits stands to attention before a shouting orc sergeant under a red banner with a black emblem, and in the middle of the line, by some mistake, stands Bastian, meek, very straight, eyes front, trying to look green; hard sunlight."
"title:1274" = "Medium close-up on a goblin quay: Bastian has tied a long grey beard of sheep's wool over his own blond one to look senior and leans on a knotted stick, pompous, eyebrows raised, lecturing two small goblin dock boys who are far more interested in the string behind his ear; a red sash with a black emblem; late light."
"title:1275" = "Wide view of a field kitchen outside a goblin port at first light, red banners with a black emblem hanging limp: the cook, a sleepy goblin, has not yet lit the fire, and already Bastian stands first and alone at the empty cauldron, eager, bowl held out in both hands, spoon ready behind his ear; cold blue dawn, mist."
"title:1276" = "From behind Bastian on a wide empty plain of red earth: he stands rigid guard, spear upright, beside one ordinary boulder as if it were a treasury, a red sash with a black emblem across his back, a bird's nest with two eggs built on his helmet and moss started on his boots; huge evening sky. We do not see his face."
"title:1277" = "Close-up at a camp in the jungle: Bastian paints his dented pauldron red with a small brush to look fearsome and tries the face that goes with it in a hand mirror, scowling as fiercely as he can, teeth bared, red paint in his beard and on his nose, and a line of red cat paw prints across his knee; green light."
"title:1278" = "Medium shot at a roadside stream in dry hills: Bastian sits on the bank with his boots off and his sore feet in the water, exhausted, shoulders sagging, eyes closed, a red standard with a black emblem leaning in the tree beside him, while a tortoise overtakes him on the road; late afternoon dust."
"title:1279" = "High angle onto a goblin dock where a hundred identical barrels stand in rows: Bastian sits among them with his boots off, counting on fingers and toes, frowning, lips moving, plainly lost somewhere after seventeen, while a helpful troll holds up three fingers of his own; red banner with a black emblem, noon."
"title:1280" = "Low angle on the sand of an overgrown stone arena in the jungle: Bastian stands in the middle with both arms raised, jubilant, head thrown back, drinking in the cheers of rows and rows of empty stone seats, where one parrot and one sleepy goblin sweeper make up the crowd; hot white light."
"title:1281" = "Side view on a jungle road: a broad orc general strides ahead with empty hands and behind him staggers Bastian under the general's spare helmet, banner, map case, stool and saddle, long-suffering, peering round the pile with one eye, sweat in his beard; red banner with a black emblem, humid afternoon."
"title:1282" = "High angle onto a grassy bank outside a goblin port: an enormous grey riding wolf in a red and black war saddle has sat down on Bastian and washes his face with its tongue, and he lies flat beneath it, helpless, arms spread, one eye shut, the reins still in his fist; an orc rider laughs; morning."
"title:1283" = "Medium close-up: a huge horned war helmet, made for a far bigger head, has dropped over Bastian's eyes so that only his nose, his beard and an uncertain mouth show below the rim, and he points his sword firmly in the wrong direction, away from the straw target; a red banner with a black emblem, dusk."
"title:1284" = "Seen through the doorway of a goblin inn from inside: Bastian tries to enter in spiked shoulder armour twice as wide as the door, stubborn, jaw set, pushing straight ahead for the third time, the spikes scraping grooves in both doorposts, while the goblin innkeeper waits with a pry bar; bright street behind him."
"title:1309" = "Close-up in a torch-lit castle corridor: Bastian marches in a captain's helmet with a white plume as tall as his arm, pleased with himself, eyes front, lips pressed in a modest smile, and has not noticed that the tip of the plume has brushed a wall torch and trails a thin ribbon of smoke; a blue and gold lion banner."
"title:1313" = "Wide view of a crowded jungle harbour dock at sunset: anglers of every race carry Bastian on their shoulders, radiant, arms spread, a fishing rod held like a sceptre and a crown of corks and feathers on his head, while a fish escapes from his shirt and Nixie quietly collects her winnings from the losers."
"title:1330" = "Seen through dark leaves in a moonlit forest: Bastian crouches on all fours on a thick branch, earnest, brow furrowed, twigs tied to his fingers for claws and two leaves stuck up for ears, face to face with a great black panther that looks at him without the least respect; silver light, fireflies."
"title:1352" = "From behind Bastian in a village street at nightfall: wrapped in a black hooded cloak far too long, he reaches up with a candle snuffer on a pole and puts out the street lanterns one by one, the hem trailing through a puddle, the street behind him already dark, shutters opening in protest. We do not see his face."
"title:144" = "Over the shoulder of a grinning pirate who salutes with a hook: on the deck of a ship with red sails in a jungle cove stands Bastian in an enormous plumed admiral's hat and a red sash, gracious, one hand raised in greeting, holding his smile although the parrot on his shoulder is pulling at his ear; sea light."
"chapter:gold" = "Side view at a corner table in a harbour tavern: Bastian counts three copper coins one by one into Nixie's open palm, reluctant, holding on to the last a moment too long, while her other hand already writes in the ledger beside the abacus and the teapot; his purse lies flat and empty; candlelight."
"chapter:secrets" = "From behind Bastian at the foot of a jungle waterfall: he holds a lantern high and parts the curtain of water with one arm, and behind it a narrow stone doorway with a single keyhole shows in the wet rock, darkness beyond; spray on his shoulders, green dusk, glow-worms. We do not see his face."
"chapter:collections" = "Wide landscape of a country road over green hills in morning sun: Bastian walks at the head of a small parade, proud, nose in the air, leading a shaggy pony, with a cat, a frog, a rabbit and a mechanical squirrel trotting behind in single file and a strapped stack of odd old books under his arm."
"chapter:camp" = "High angle from a tree onto a forest clearing at dusk: a good campfire in a ring of stones, a patched tent, a camp chair, a blue banner and a small anvil set around it, and in the middle Bastian with a bowl of stew on his knees, content, feet stretched to the flames, looking round at what he has built."
"chapter:rares" = "Low angle from inside a gigantic clawed footprint pressed into the mud of a misty savanna: Bastian kneels in it and measures one toe with both arms spread, awed, mouth open, while in the haze behind him, unnoticed, stands the enormous pale-striped beast that made it; red dawn."
