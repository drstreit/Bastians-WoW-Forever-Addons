[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bastians-build"
version = "0.1.0"
description = "Build pipeline and tooling for Bastian's WoW Forever addons"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "lupa", "pillow"]

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The Lua tests embed Lua snippets as strings; their width follows StyLua (110), not Python's 100.
"tests/lua/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bastians_build"]
